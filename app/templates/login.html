{% extends "base.html" %}

{% block content %}
<section class="login-shell">
  <div class="login-card">
    <h2>Sign in</h2>
    <p class="login-help">Sign in to continue.</p>

    {% if error_message %}
    <p class="notice notice-error">{{ error_message }}</p>
    {% endif %}

    <form method="post" action="{{ request.url_for('login_submit') }}" class="login-form">
      <input type="hidden" name="next_path" value="{{ next_path }}" />

      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required />
      </label>

      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>

      <button type="submit">Sign in</button>
    </form>

    <p class="login-alternative">
      Pairing this Kindle? <a href="{{ request.url_for('activate_page') }}{% if next_path != '/' %}?next={{ next_path | urlencode }}{% endif %}">Use a one-time code</a>.
    </p>
  </div>
</section>
{% endblock %}
